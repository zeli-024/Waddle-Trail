name: Build Waddle Trail

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: WaddleTrail_0.0.1-neoforge-1.21.1
          path: build/libs/WaddleTrail_0.0.1-neoforge-1.21.1.jar
          if-no-files-found: error
